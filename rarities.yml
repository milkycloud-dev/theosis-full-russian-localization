###########################################################################################
#                                                                                         #
#      JACKPOT ROLLS / ROLLS ESPECIALES                                                   #
#                                                                                         #
#  Estos rolls se aplican DESPUÉS del rango base de la rareza.                            #
#  Su función es hacer que algunos items salgan mejor de lo normal.                       #
#                                                                                         #
#  These rolls are applied AFTER the rarity base stat roll.                               #
#  Their purpose is to make some items roll better than usual.                            #
#                                                                                         #
###########################################################################################

jackpot_rolls:
  enabled: true

  # Si es true, solo se aplica el jackpot más alto que haya ganado el item.
  # If true, only the highest jackpot that succeeded is applied.
  highest_only: true

  tiers:
    lucky:
      chance: 0.0200               # 2.00%
      stat_multiplier_min: 1.08
      stat_multiplier_max: 1.18

    masterwork:
      chance: 0.0025               # 0.25%
      stat_multiplier_min: 1.18
      stat_multiplier_max: 1.38

    divine:
      chance: 0.0005               # 0.05%
      stat_multiplier_min: 1.35
      stat_multiplier_max: 1.60

    apex:
      chance: 0.0001               # 0.01% = 1 en 10,000
      stat_multiplier_min: 1.60
      stat_multiplier_max: 1.85

###########################################################################################
#                                                                                         #
#      LIMITES SUAVES / SOFT LIMITS                                                       #
#                                                                                         #
#  Estos límites NO quitan el jackpot, solo evitan que los números se vayan demasiado     #
#  arriba si más adelante agregas boosts extra, gems, perks o rerolls.                    #
#                                                                                         #
#  These limits do NOT remove the jackpot, they only prevent numbers from going too high   #
#  if you later add extra boosts, gems, perks or rerolls.                                 #
#                                                                                         #
###########################################################################################

